                <nav>

                <input type="number" placeholder="Broj telefona" id="tel">
                <input type="text" placeholder="Naziv ekipe" id="ekipa">

                <textarea name="Motivaciono pismo" id="motivaciono_pismo" placeholder="Motivaciono pismo"></textarea>
                <input type="button" name="Potvda" id="potvrda" value="PRIJAVI SE">
            </form>

            <div id="modal" class="modali">
                <div class="modal_sadrzaj">
                    <span class="zatvori">&times;</span>
                    <p>Vaša prijava je evidentirana!</p>
